# Server settings
spring.application.name=java
server.port=8081
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=/app/src/main/java

# DB settings (Docker Compose 기준)
spring.datasource.url=jdbc:postgresql://db:5432/livecommerce
spring.datasource.username=user
spring.datasource.password=password

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT (Base64-encoded secret recommended)
jwt.secret=${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXo1Njc4OTA=} 
jwt.access-validity-ms=${JWT_ACCESS_MS:900000}
jwt.refresh-validity-ms=${JWT_REFRESH_MS:1209600000}
