# Server settings
spring.application.name=java
server.port=8081
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=/app/src/main/java

# DB settings (env로 오버라이드 가능)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/livecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT (Base64-encoded secret recommended)
jwt.secret=${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXo1Njc4OTA=} 
jwt.access-validity-ms=${JWT_ACCESS_MS:900000}
jwt.refresh-validity-ms=${JWT_REFRESH_MS:1209600000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Storage (local default)
storage.provider=${STORAGE_PROVIDER:local}
storage.local-dir=${STORAGE_LOCAL_DIR:/data/uploads}
storage.public-base=${STORAGE_PUBLIC_BASE:http://localhost:8081/media}

# springdoc-openapi
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.paths-to-match=/api/**,/orders/**,/orderitems/**,/payments/**,/shippings/**,/sellermonthlysummarys/**,/
logging.level.org.springdoc=DEBUG
